name: CI
on:
  push:
    branches:
      - main
      - dimsum-external
  pull_request:
    branches:
      - main
      - dimsum-external
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"
      - run: mvn --batch-mode package spotless:check
